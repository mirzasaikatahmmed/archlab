name: Release

# Pushing a tag such as v0.2.0 builds installers for every platform and attaches them, with the
# update manifest (latest.json), to a DRAFT GitHub Release. Publish the draft by hand.
# Signing is optional: see docs/adr/ADR-012-packaging-and-updates.md for the secrets.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versions:
    name: Check versions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-version.mjs "${GITHUB_REF_NAME}"

  build:
    name: ${{ matrix.name }}
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: macOS (Apple silicon),
              os: macos-latest,
              target: aarch64-apple-darwin,
              ffmpeg: false,
            }
          - { name: macOS (Intel), os: macos-15-intel, target: x86_64-apple-darwin, ffmpeg: false }
          - { name: Linux, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ffmpeg: true }
          - { name: Windows, os: windows-latest, target: x86_64-pc-windows-msvc, ffmpeg: true }
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Fetch the pinned LGPL ffmpeg
        if: matrix.ffmpeg
        run: node scripts/ffmpeg.mjs ${{ matrix.target }}

      # Signing is opt-in: a variable is only exported when its secret exists, so a build
      # without secrets is simply unsigned.
      - name: Prepare macOS signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate configured: the macOS build will be unsigned."
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "$name=$value" >> "$GITHUB_ENV"
            fi
          done

      - name: Prepare Windows signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE)) {
            Write-Host "No Windows certificate configured: the Windows build will be unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $conf = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } } }
          $conf | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $env:RUNNER_TEMP "tauri.windows-sign.conf.json")
          "WINDOWS_SIGN_CONFIG=--config $env:RUNNER_TEMP\tauri.windows-sign.conf.json" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ArchLab ${{ github.ref_name }}
          releaseBody: Unsigned unless the signing secrets were configured. Estimates only; see the README.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: >-
            --target ${{ matrix.target }}
            --config src-tauri/tauri.release.conf.json
            ${{ matrix.ffmpeg && '--config src-tauri/tauri.ffmpeg.conf.json' || '' }}
            ${{ env.WINDOWS_SIGN_CONFIG }}
