[package]
name = "archlab"
version = "0.1.0"
description = "Capacity planning and distributed-system simulation"
authors = ["ArchLab contributors"]
license = "UNLICENSED"
edition = "2024"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "archlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
thiserror = "2.0.21"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
specta-typescript = "0.0.15"
rusqlite = { version = "0.41", features = ["bundled"] }
rusqlite_migration = "2.7.0"
sysinfo = "0.40.4"
rand_chacha = "0.10.0"
libm = "0.2.16"
tokio = { version = "1.54.1", features = ["net", "time", "io-util", "sync", "rt-multi-thread"] }
rfd = "0.15"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
